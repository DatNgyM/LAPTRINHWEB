<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Hướng dẫn viên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f4f6f9;
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            padding: 15px 0;
            height: 100vh;
            position: fixed;
        }
        
        .sidebar-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .sidebar-item:hover {
            background-color: #4b545c;
        }
        
        .sidebar-item.active {
            background-color: #007bff;
        }
        
        .sidebar-item i {
            margin-right: 10px;
        }
        
        .content {
            flex: 1;
            padding: 20px;
            margin-left: 250px;
        }
        
        .card {
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        
        .btn {
            padding: 8px 15px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        
        .btn:hover {
            background-color: #0069d9;
        }
        
        .btn-secondary {
            background-color: #6c757d;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        
        .row {
            display: flex;
            flex-wrap: wrap;
            margin-right: -15px;
            margin-left: -15px;
        }
        
        .col-md-6 {
            flex: 0 0 50%;
            max-width: 50%;
            padding: 0 15px;
        }

        .avatar-upload {
            position: relative;
            max-width: 200px;
            margin: 10px auto 20px;
        }

        .avatar-upload .avatar-preview {
            width: 192px;
            height: 192px;
            position: relative;
            border-radius: 100%;
            border: 6px solid #f8f9fa;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
        }

        .avatar-upload .avatar-preview > div {
            width: 100%;
            height: 100%;
            border-radius: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-image: url('https://randomuser.me/api/portraits/men/32.jpg');
        }

        .avatar-upload .avatar-edit {
            position: absolute;
            right: 12px;
            z-index: 1;
            top: 10px;
        }

        .avatar-upload .avatar-edit input {
            display: none;
        }

        .avatar-upload .avatar-edit label {
            display: inline-block;
            width: 34px;
            height: 34px;
            margin-bottom: 0;
            border-radius: 100%;
            background: #FFFFFF;
            border: 1px solid #d2d6de;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.12);
            cursor: pointer;
            font-weight: normal;
            transition: all .2s ease-in-out;
            line-height: 34px;
            text-align: center;
        }

        .avatar-upload .avatar-edit label:hover {
            background: #f1f1f1;
            border-color: #d6d6d6;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-right: 15px;
        }

        .checkbox-item input {
            margin-right: 5px;
        }

        .certificate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 8px;
            background-color: #f9f9f9;
        }

        .certificate-item i {
            margin-right: 8px;
            color: #6c757d;
        }

        .certificate-item .remove-btn {
            color: #dc3545;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-item">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
        </div>
        <div class="sidebar-item">
            <i class="fas fa-map-marked-alt"></i>
            <span>Quản lý Tour</span>
        </div>
        <div class="sidebar-item">
            <i class="fas fa-users"></i>
            <span>Quản lý Người dùng</span>
        </div>
        <div class="sidebar-item">
            <i class="fas fa-bus"></i>
            <span>Quản lý Phương tiện</span>
        </div>
        <div class="sidebar-item">
            <i class="fas fa-hotel"></i>
            <span>Quản lý Nơi ở</span>
        </div>
        <div class="sidebar-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Quản lý Lịch trình</span>
        </div>
        <div class="sidebar-item active">
            <i class="fas fa-user-tie"></i>
            <span>Quản lý HDV</span>
        </div>
    </div>

    <div class="content">
        <div class="header">
            <h2>Chỉnh sửa Hướng dẫn viên</h2>
            <a href="Index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Quay lại</a>
        </div>

        <div class="card">
            <form id="editTourGuideForm">
                <input type="hidden" id="guideId" value="HDV001">
                
                <div class="avatar-upload">
                    <div class="avatar-edit">
                        <input type="file" id="imageUpload" accept=".png, .jpg, .jpeg" />
                        <label for="imageUpload"><i class="fas fa-pencil-alt"></i></label>
                    </div>
                    <div class="avatar-preview">
                        <div id="imagePreview"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="fullName">Họ và tên:</label>
                            <input type="text" id="fullName" class="form-control" value="Nguyễn Văn A" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" class="form-control" value="nguyenvana@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Số điện thoại:</label>
                            <input type="tel" id="phone" class="form-control" value="0912345678" required>
                        </div>
                        <div class="form-group">
                            <label for="birthdate">Ngày sinh:</label>
                            <input type="date" id="birthdate" class="form-control" value="1990-06-15" required>
                        </div>
                        <div class="form-group">
                            <label for="idCard">Số CMND/CCCD:</label>
                            <input type="text" id="idCard" class="form-control" value="0123456789" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="experience">Số năm kinh nghiệm:</label>
                            <input type="number" id="experience" class="form-control" value="5" min="0" required>
                        </div>
                        <div class="form-group">
                            <label>Ngôn ngữ:</label>
                            <div class="checkbox-group">
                                <div class="checkbox-item">
                                    <input type="checkbox" id="vietnamese" checked>
                                    <label for="vietnamese">Tiếng Việt</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="english" checked>
                                    <label for="english">Tiếng Anh</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="french">
                                    <label for="french">Tiếng Pháp</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="chinese">
                                    <label for="chinese">Tiếng Trung</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="japanese">
                                    <label for="japanese">Tiếng Nhật</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="korean">
                                    <label for="korean">Tiếng Hàn</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="specialization">Chuyên môn:</label>
                            <select id="specialization" class="form-control" required>
                                <option value="">-- Chọn chuyên môn --</option>
                                <option value="domestic" selected>Du lịch trong nước</option>
                                <option value="international">Du lịch quốc tế</option>
                                <option value="ecotourism">Du lịch sinh thái</option>
                                <option value="cultural">Du lịch văn hóa</option>
                                <option value="adventure">Du lịch mạo hiểm</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="address">Địa chỉ:</label>
                            <input type="text" id="address" class="form-control" value="123 Đường ABC, Quận 1, TP.HCM" required>
                        </div>
                        <div class="form-group">
                            <label for="status">Trạng thái:</label>
                            <select id="status" class="form-control" required>
                                <option value="active" selected>Hoạt động</option>
                                <option value="inactive">Tạm nghỉ</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="bio">Giới thiệu:</label>
                    <textarea id="bio" class="form-control" rows="4">Nguyễn Văn A là hướng dẫn viên du lịch với hơn 5 năm kinh nghiệm, chuyên về các tour du lịch trong nước. Anh có khả năng giao tiếp tiếng Anh lưu loát và hiểu biết sâu rộng về văn hóa, lịch sử Việt Nam.</textarea>
                </div>
                
                <div class="form-group">
                    <label>Chứng chỉ hiện tại:</label>
                    <div>
                        <div class="certificate-item">
                            <div>
                                <i class="far fa-file-pdf"></i>
                                <span>Chứng chỉ Hướng dẫn viên du lịch.pdf</span>
                            </div>
                            <button type="button" class="remove-btn" title="Xóa"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="certificate-item">
                            <div>
                                <i class="far fa-file-pdf"></i>
                                <span>Chứng chỉ Ngoại ngữ TOEIC 750.pdf</span>
                            </div>
                            <button type="button" class="remove-btn" title="Xóa"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="certificate-item">
                            <div>
                                <i class="far fa-file-pdf"></i>
                                <span>Chứng chỉ Sơ cấp cứu.pdf</span>
                            </div>
                            <button type="button" class="remove-btn" title="Xóa"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="certificate">Thêm chứng chỉ mới (chọn nhiều file):</label>
                    <input type="file" id="certificate" class="form-control" multiple>
                </div>
                
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn">Cập nhật thông tin</button>
                    <a href="Index.html" class="btn btn-secondary" style="margin-left: 10px;">Hủy</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('editTourGuideForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Đã cập nhật thông tin hướng dẫn viên thành công!');
            window.location.href = 'Index.html';
        });

        // Xử lý xem trước ảnh khi upload
        function readURL(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').style.backgroundImage = 'url(' + e.target.result + ')';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.getElementById("imageUpload").addEventListener("change", function() {
            readURL(this);
        });

        // Xử lý nút xóa chứng chỉ
        const removeButtons = document.querySelectorAll('.remove-btn');
        removeButtons.forEach(button => {
            button.addEventListener('click', function() {
                if (confirm('Bạn có chắc muốn xóa chứng chỉ này?')) {
                    this.closest('.certificate-item').remove();
                }
            });
        });
    </script>
</body>
</html>
